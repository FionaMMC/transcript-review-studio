name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  interface:
    name: Interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=moderate

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python scripts/privacy_check.py --history
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: ruff check backend scripts
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - run: pip-audit -r backend/requirements.txt --progress-spinner off
